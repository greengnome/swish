# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 45

    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for testing
        run: |
          xcodebuild \
            -project Swish.xcodeproj \
            -scheme Swish \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            build-for-testing

      # Hosted simulators can drop the cross-app Settings foreground transition.
      # Its URL is unit-tested, and the complete handoff remains in the local UI suite.
      - name: Run tests
        run: |
          xcodebuild \
            -project Swish.xcodeproj \
            -scheme Swish \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/SwishTests.xcresult" \
            -parallel-testing-enabled NO \
            -skip-testing:SwishUITests/SwishUITests/testDisplaysRunningTimerOutsideApp \
            -skip-testing:SwishUITests/SwishUITests/testOpensAppLanguageSettings \
            test-without-building

      - name: Run Live Activity system UI test in isolation
        run: |
          xcodebuild \
            -project Swish.xcodeproj \
            -scheme Swish \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/SwishLiveActivityUITests.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:SwishUITests/SwishUITests/testDisplaysRunningTimerOutsideApp \
            test-without-building

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Swish-test-results
          path: |
            ${{ runner.temp }}/SwishTests.xcresult
            ${{ runner.temp }}/SwishLiveActivityUITests.xcresult
          if-no-files-found: ignore
          retention-days: 7
